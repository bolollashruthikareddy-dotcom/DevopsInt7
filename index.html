<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your account">
  <title>Sign in</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 400px);
      padding: 36px;
      background: #fff;
      border: 1px solid #e5eaf2;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgb(23 32 51 / 8%);
    }

    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .intro { margin: 0 0 28px; color: #647087; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: .92rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd3df;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid rgb(67 97 238 / 18%);
      border-color: #4361ee;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #4361ee;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #304bd0; }
    #message { min-height: 1.4em; margin: 14px 0 0; color: #b42318; font-size: .9rem; }

    @media (max-width: 440px) {
      .login-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="intro">Sign in to continue to your account.</p>

    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters">

      <button type="submit">Sign in</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    document.querySelector("#login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const message = document.querySelector("#message");

      if (!event.currentTarget.reportValidity()) return;
      message.textContent = "Form validated. Connect this page to your authentication service to sign in.";
      message.style.color = "#475467";
    });
  </script>
</body>
</html>
